
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | XS Donate</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-page">
    <div class="auth-card">
        <h1>XS Donate</h1>
        <p>Crie sua conta gratuitamente</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Nome de usuário</label>
                <input type="text" id="username" placeholder="Digite seu nome" required maxlength="100">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Digite seu email" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Crie uma senha" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar senha</label>
                <input type="password" id="confirmPassword" placeholder="Repita sua senha" required>
            </div>

            <button type="submit" class="auth-button" id="registerButton">
                Criar Conta
            </button>
        </form>

        <div class="auth-links">
            <a href="login.html">Já possui uma conta? Entrar</a>
        </div>
    </div>

    <script src="../js/app.js"></script>

    <script>
        "use strict";

        // Usa o mesmo domínio do XS Donate publicado no Render.
        const API = "/api";

        const form = document.getElementById("registerForm");
        const button = document.getElementById("registerButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const name = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!name) {
                alert("Digite seu nome.");
                return;
            }

            if (password !== confirmPassword) {
                alert("As senhas não coincidem.");
                return;
            }

            if (password.length < 6) {
                alert("A senha deve ter pelo menos 6 caracteres.");
                return;
            }

            button.disabled = true;
            button.textContent = "Criando conta...";

            try {
                const response = await fetch(`${API}/auth/register`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    alert(data.message || "Não foi possível criar a conta.");
                    return;
                }

                alert("Conta criada com sucesso! Agora faça seu login.");
                window.location.href = "login.html";

            } catch (error) {
                console.error("Erro no cadastro:", error);
                alert("Não foi possível conectar ao servidor. Tente novamente.");
            } finally {
                button.disabled = false;
                button.textContent = "Criar Conta";
            }
        });
    </script>
</body>
</html>
